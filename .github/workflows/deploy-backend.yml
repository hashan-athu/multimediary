name: Deploy Backend → Oracle VM

on:
  workflow_dispatch:
  push:
    branches: [dev]
    paths:
      - "backend/**"
      - "deploy/**"
      - ".github/workflows/deploy-backend.yml"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/backend
  DOCS_IMAGE_NAME: ${{ github.repository }}/docs

jobs:
  # ─────────────────────────────────────────────
  # 1. Build & push image to GHCR
  # ─────────────────────────────────────────────
  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=dev
            type=sha,prefix=sha-

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─────────────────────────────────────────────
  # 2. Deploy to Oracle VM
  # ─────────────────────────────────────────────
  deploy:
    name: Deploy to Oracle VM
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: dev
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate required secrets
        env:
          ORACLE_VM_HOST: ${{ secrets.ORACLE_VM_HOST }}
          ORACLE_VM_USER: ${{ secrets.ORACLE_VM_USER }}
          ORACLE_VM_SSH_KEY: ${{ secrets.ORACLE_VM_SSH_KEY }}
          RAILS_MASTER_KEY: ${{ secrets.RAILS_MASTER_KEY }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          POSTGRES_CACHE_DB: ${{ secrets.POSTGRES_CACHE_DB }}
          POSTGRES_QUEUE_DB: ${{ secrets.POSTGRES_QUEUE_DB }}
          POSTGRES_CABLE_DB: ${{ secrets.POSTGRES_CABLE_DB }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          CORS_ALLOWED_ORIGINS: ${{ secrets.CORS_ALLOWED_ORIGINS }}
          BACKEND_DOMAIN: ${{ secrets.BACKEND_DOMAIN }}
        run: |
          set -euo pipefail
          missing=0
          required_secrets=(
            ORACLE_VM_HOST ORACLE_VM_USER ORACLE_VM_SSH_KEY
            RAILS_MASTER_KEY
            POSTGRES_USER POSTGRES_PASSWORD POSTGRES_DB
            POSTGRES_CACHE_DB POSTGRES_QUEUE_DB POSTGRES_CABLE_DB
            TMDB_API_KEY CORS_ALLOWED_ORIGINS BACKEND_DOMAIN
          )
          for name in "${required_secrets[@]}"; do
            if [ -z "${!name:-}" ]; then
              echo "::error title=Missing secret::${name} is not set in the dev environment."
              missing=1
            fi
          done
          if [ -n "${ORACLE_VM_SSH_KEY:-}" ] && ! printf '%s' "${ORACLE_VM_SSH_KEY}" | grep -q "BEGIN .*PRIVATE KEY"; then
            echo "::error title=Invalid SSH key::ORACLE_VM_SSH_KEY must include BEGIN/END lines."
            missing=1
          fi
          [ "${missing}" -eq 0 ] || exit 1

      # ── Copy deploy files to VM ──────────────────────────────────────────────
      - name: Copy compose and Caddyfile to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.ORACLE_VM_HOST }}
          username: ${{ secrets.ORACLE_VM_USER }}
          key: ${{ secrets.ORACLE_VM_SSH_KEY }}
          source: "deploy/docker-compose.prod.yml,deploy/Caddyfile"
          target: "/opt/multimediary"
          strip_components: 1

      # ── Pull image on VM while old containers are still running ─────────────
      - name: Pull new image on VM
        uses: appleboy/ssh-action@v1.0.3
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_ACTOR: ${{ github.actor }}
          BACKEND_IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:dev
          DOCS_IMAGE: ${{ env.REGISTRY }}/${{ env.DOCS_IMAGE_NAME }}:dev
        with:
          host: ${{ secrets.ORACLE_VM_HOST }}
          username: ${{ secrets.ORACLE_VM_USER }}
          key: ${{ secrets.ORACLE_VM_SSH_KEY }}
          envs: GH_TOKEN,GH_ACTOR,BACKEND_IMAGE,DOCS_IMAGE
          # Tight timeout — pull only; old containers keep serving during this step
          command_timeout: 8m
          script: |
            set -euo pipefail
            echo "Logging in to GHCR..."
            echo "${GH_TOKEN}" | docker login ghcr.io -u "${GH_ACTOR}" --password-stdin
            echo "Pulling: ${BACKEND_IMAGE}"
            docker pull "${BACKEND_IMAGE}"
            echo "Pulling: ${DOCS_IMAGE}"
            docker pull "${DOCS_IMAGE}" || echo "Docs image not yet published — skipping."
            echo "Pull complete."

      # ── Write env file and swap containers ──────────────────────────────────
      - name: Write env file and restart containers
        uses: appleboy/ssh-action@v1.0.3
        env:
          RAILS_MASTER_KEY: ${{ secrets.RAILS_MASTER_KEY }}
          BACKEND_IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:dev
          DOCS_IMAGE: ${{ env.REGISTRY }}/${{ env.DOCS_IMAGE_NAME }}:dev
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          POSTGRES_CACHE_DB: ${{ secrets.POSTGRES_CACHE_DB }}
          POSTGRES_QUEUE_DB: ${{ secrets.POSTGRES_QUEUE_DB }}
          POSTGRES_CABLE_DB: ${{ secrets.POSTGRES_CABLE_DB }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          CORS_ALLOWED_ORIGINS: ${{ secrets.CORS_ALLOWED_ORIGINS }}
          BACKEND_DOMAIN: ${{ secrets.BACKEND_DOMAIN }}
        with:
          host: ${{ secrets.ORACLE_VM_HOST }}
          username: ${{ secrets.ORACLE_VM_USER }}
          key: ${{ secrets.ORACLE_VM_SSH_KEY }}
          envs: RAILS_MASTER_KEY,BACKEND_IMAGE,DOCS_IMAGE,POSTGRES_USER,POSTGRES_PASSWORD,POSTGRES_DB,POSTGRES_CACHE_DB,POSTGRES_QUEUE_DB,POSTGRES_CABLE_DB,TMDB_API_KEY,CORS_ALLOWED_ORIGINS,BACKEND_DOMAIN
          # Only swap + migrate + health-check; pull already finished above
          command_timeout: 6m
          script: |
            set -euo pipefail

            show_diagnostics() {
              echo "=== DEPLOYMENT FAILED — diagnostics ==="
              cd /opt/multimediary || return
              docker compose --env-file .env.production -f docker-compose.prod.yml ps      || true
              docker compose --env-file .env.production -f docker-compose.prod.yml logs --tail=100 backend || true
              docker compose --env-file .env.production -f docker-compose.prod.yml logs --tail=50  db      || true
            }
            trap show_diagnostics ERR

            cd /opt/multimediary

            echo "Writing .env.production..."
            umask 077
            {
              printf 'RAILS_MASTER_KEY=%s\n'    "${RAILS_MASTER_KEY}"
              printf 'POSTGRES_USER=%s\n'       "${POSTGRES_USER}"
              printf 'POSTGRES_PASSWORD=%s\n'   "${POSTGRES_PASSWORD}"
              printf 'POSTGRES_DB=%s\n'         "${POSTGRES_DB}"
              printf 'POSTGRES_CACHE_DB=%s\n'   "${POSTGRES_CACHE_DB}"
              printf 'POSTGRES_QUEUE_DB=%s\n'   "${POSTGRES_QUEUE_DB}"
              printf 'POSTGRES_CABLE_DB=%s\n'   "${POSTGRES_CABLE_DB}"
              printf 'TMDB_API_KEY=%s\n'        "${TMDB_API_KEY}"
              printf 'CORS_ALLOWED_ORIGINS=%s\n' "${CORS_ALLOWED_ORIGINS}"
              printf 'BACKEND_DOMAIN=%s\n'      "${BACKEND_DOMAIN}"
            } > .env.production

            export BACKEND_IMAGE="${BACKEND_IMAGE}"
            export DOCS_IMAGE="${DOCS_IMAGE}"

            echo "Validating compose config..."
            docker compose --env-file .env.production -f docker-compose.prod.yml config --quiet

            echo "Ensuring db is up and healthy..."
            docker compose --env-file .env.production -f docker-compose.prod.yml up -d db
            for i in $(seq 1 12); do
              health=$(docker inspect --format='{{.State.Health.Status}}' multimediary-db-1 2>/dev/null || echo "unknown")
              [ "${health}" = "healthy" ] && break
              echo "  db health: ${health} — waiting 5s..."
              sleep 5
            done

            echo "Running db-init (creates missing databases idempotently)..."
            docker compose --env-file .env.production -f docker-compose.prod.yml run --rm db-init

            echo "Restarting containers..."
            if docker image inspect "${DOCS_IMAGE}" >/dev/null 2>&1; then
              echo "Docs image present — starting all services including docs."
              docker compose --env-file .env.production -f docker-compose.prod.yml --profile docs up -d --remove-orphans
            else
              echo "Docs image not yet available — starting without docs service."
              docker compose --env-file .env.production -f docker-compose.prod.yml up -d --remove-orphans
            fi

            echo "Waiting for backend to pass health check..."
            for i in $(seq 1 24); do
              status=$(docker compose --env-file .env.production -f docker-compose.prod.yml \
                exec -T backend curl -sf http://localhost/up 2>/dev/null | \
                python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('status',''))" 2>/dev/null || true)
              if [ "${status}" = "ok" ]; then
                echo "Health check passed after $((i * 5))s."
                break
              fi
              if [ "${i}" -eq 24 ]; then
                echo "Health check did not pass within 120s."
                exit 1
              fi
              echo "  attempt ${i}/24 — waiting 5s..."
              sleep 5
            done

            echo "Pruning unused images..."
            docker image prune -f

            docker compose --env-file .env.production -f docker-compose.prod.yml ps
            echo "Deployment complete."
