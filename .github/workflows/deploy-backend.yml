name: Deploy Backend → Oracle VM

on:
  workflow_dispatch:
  push:
    branches: [dev]
    paths:
      - "backend/**"
      - "deploy/**"
      - ".github/workflows/deploy-backend.yml"

env:
  REGISTRY: ghcr.io
  # github.repository = hashan-athu/multimediary → image = ghcr.io/hashan-athu/multimediary/backend
  IMAGE_NAME: ${{ github.repository }}/backend

jobs:
  # ─────────────────────────────────────────────
  # 1. Build & push image to GHCR
  # ─────────────────────────────────────────────
  build-and-push:
    name: 🐳 Build & Push Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # Always tag as :dev (stable ref for the compose file on the server)
            type=raw,value=dev
            # Also tag by short SHA for audit trail
            type=sha,prefix=sha-

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          # Oracle VM (AMD64); adjust to arm64 if using Ampere A1 shape
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Layer caching via GitHub Actions cache
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─────────────────────────────────────────────
  # 2. SSH into Oracle VM and restart container
  # ─────────────────────────────────────────────
  deploy:
    name: 🚀 Deploy to Oracle VM
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: dev   # maps to the "dev" GitHub Environment (set protection rules there)
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate required deployment secrets
        env:
          ORACLE_VM_HOST: ${{ secrets.ORACLE_VM_HOST }}
          ORACLE_VM_USER: ${{ secrets.ORACLE_VM_USER }}
          ORACLE_VM_SSH_KEY: ${{ secrets.ORACLE_VM_SSH_KEY }}
          RAILS_MASTER_KEY: ${{ secrets.RAILS_MASTER_KEY }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          POSTGRES_CACHE_DB: ${{ secrets.POSTGRES_CACHE_DB }}
          POSTGRES_QUEUE_DB: ${{ secrets.POSTGRES_QUEUE_DB }}
          POSTGRES_CABLE_DB: ${{ secrets.POSTGRES_CABLE_DB }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          CORS_ALLOWED_ORIGINS: ${{ secrets.CORS_ALLOWED_ORIGINS }}
        run: |
          set -euo pipefail

          missing=0
          required_secrets=(
            ORACLE_VM_HOST
            ORACLE_VM_USER
            ORACLE_VM_SSH_KEY
            RAILS_MASTER_KEY
            POSTGRES_USER
            POSTGRES_PASSWORD
            POSTGRES_DB
            POSTGRES_CACHE_DB
            POSTGRES_QUEUE_DB
            POSTGRES_CABLE_DB
            TMDB_API_KEY
            CORS_ALLOWED_ORIGINS
          )

          for name in "${required_secrets[@]}"; do
            if [ -z "${!name:-}" ]; then
              echo "::error title=Missing GitHub secret::${name} is not configured for the dev environment or repository."
              missing=1
            fi
          done

          if [ -n "${ORACLE_VM_SSH_KEY:-}" ] && ! printf '%s' "${ORACLE_VM_SSH_KEY}" | grep -q "BEGIN .*PRIVATE KEY"; then
            echo "::error title=Invalid SSH key secret::ORACLE_VM_SSH_KEY must contain the full private key, including BEGIN/END lines."
            missing=1
          fi

          if [ "${missing}" -ne 0 ]; then
            exit 1
          fi

      - name: Prepare server directory and verify Docker
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.ORACLE_VM_HOST }}
          username: ${{ secrets.ORACLE_VM_USER }}
          key: ${{ secrets.ORACLE_VM_SSH_KEY }}
          script: |
            set -euo pipefail

            sudo install -d -m 755 -o "$(id -un)" -g "$(id -gn)" /opt/multimediary

            docker --version
            docker compose version

      # Copy the production compose file to the server.
      # If the file hasn't changed this is a no-op but keeps the server in sync.
      - name: Copy compose file to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.ORACLE_VM_HOST }}
          username: ${{ secrets.ORACLE_VM_USER }}
          key: ${{ secrets.ORACLE_VM_SSH_KEY }}
          source: "deploy/docker-compose.prod.yml"
          target: "/opt/multimediary"
          strip_components: 1      # strips "deploy/" prefix → lands as docker-compose.prod.yml

      - name: Deploy & restart containers
        uses: appleboy/ssh-action@v1.0.3
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_ACTOR: ${{ github.actor }}
          RAILS_MASTER_KEY: ${{ secrets.RAILS_MASTER_KEY }}
          BACKEND_IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:dev
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          POSTGRES_CACHE_DB: ${{ secrets.POSTGRES_CACHE_DB }}
          POSTGRES_QUEUE_DB: ${{ secrets.POSTGRES_QUEUE_DB }}
          POSTGRES_CABLE_DB: ${{ secrets.POSTGRES_CABLE_DB }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          CORS_ALLOWED_ORIGINS: ${{ secrets.CORS_ALLOWED_ORIGINS }}
        with:
          host: ${{ secrets.ORACLE_VM_HOST }}
          username: ${{ secrets.ORACLE_VM_USER }}
          key: ${{ secrets.ORACLE_VM_SSH_KEY }}
          envs: GH_TOKEN,GH_ACTOR,RAILS_MASTER_KEY,BACKEND_IMAGE,POSTGRES_USER,POSTGRES_PASSWORD,POSTGRES_DB,POSTGRES_CACHE_DB,POSTGRES_QUEUE_DB,POSTGRES_CABLE_DB,TMDB_API_KEY,CORS_ALLOWED_ORIGINS
          command_timeout: 30m
          script: |
            set -euo pipefail
            show_diagnostics() {
              echo "▶ Deployment diagnostics..."
              cd /opt/multimediary || return 0
              docker compose --env-file .env.production -f docker-compose.prod.yml ps || true
              docker compose --env-file .env.production -f docker-compose.prod.yml logs --tail=200 backend || true
              docker compose --env-file .env.production -f docker-compose.prod.yml logs --tail=100 db || true
            }
            trap show_diagnostics ERR

            echo "▶ Logging in to GHCR..."
            echo "${GH_TOKEN}" | docker login ghcr.io -u "${GH_ACTOR}" --password-stdin

            echo "▶ Pulling latest image: ${BACKEND_IMAGE}"
            docker pull "${BACKEND_IMAGE}"

            cd /opt/multimediary

            echo "▶ Writing .env.production from GitHub Secrets..."
            umask 077
            {
              printf '%s\n' "RAILS_MASTER_KEY=${RAILS_MASTER_KEY}"
              printf '%s\n' "POSTGRES_USER=${POSTGRES_USER}"
              printf '%s\n' "POSTGRES_PASSWORD=${POSTGRES_PASSWORD}"
              printf '%s\n' "POSTGRES_DB=${POSTGRES_DB}"
              printf '%s\n' "POSTGRES_CACHE_DB=${POSTGRES_CACHE_DB}"
              printf '%s\n' "POSTGRES_QUEUE_DB=${POSTGRES_QUEUE_DB}"
              printf '%s\n' "POSTGRES_CABLE_DB=${POSTGRES_CABLE_DB}"
              printf '%s\n' "TMDB_API_KEY=${TMDB_API_KEY}"
              printf '%s\n' "CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS}"
            } > .env.production

            echo "▶ Starting/restarting containers..."
            # BACKEND_IMAGE is consumed by docker-compose.prod.yml via ${BACKEND_IMAGE}
            export BACKEND_IMAGE="${BACKEND_IMAGE}"
            docker compose --env-file .env.production -f docker-compose.prod.yml config --quiet
            docker compose --env-file .env.production -f docker-compose.prod.yml up -d --remove-orphans

            echo "▶ Waiting for backend to be healthy..."
            sleep 10
            docker compose --env-file .env.production -f docker-compose.prod.yml ps

            echo "▶ Pruning unused images..."
            docker image prune -f

            echo "✅ Deployment complete!"
