# Production Docker Compose — Oracle VM
# ─────────────────────────────────────────────────────────────────────────────
# Deployed to /opt/multimediary/ by the GitHub Actions deploy workflow.
# The workflow writes .env.production from GitHub Environment secrets.
#
# Manual run on the VM:
#   export BACKEND_IMAGE=ghcr.io/hashan-athu/multimediary/backend:dev
#   docker compose --env-file .env.production -f docker-compose.prod.yml up -d
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── PostgreSQL ───────────────────────────────────────────────────────────────
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    # No host port — reachable only via backend-net
    volumes:
      - pgdata:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    # Tuned for 1 GB RAM VMs — reduces default 128 MB shared_buffers and limits connections
    command: >
      postgres
      -c shared_buffers=64MB
      -c max_connections=25
      -c work_mem=4MB
      -c maintenance_work_mem=32MB
      -c effective_cache_size=256MB
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend-net
    deploy:
      resources:
        limits:
          memory: 192M

  # ── PostgreSQL database bootstrap (runs once, idempotent) ───────────────────
  db-init:
    image: postgres:17-alpine
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env.production
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
    command:
      - sh
      - -c
      - |
        set -eu
        for db in "$${POSTGRES_DB}" "$${POSTGRES_CACHE_DB}" "$${POSTGRES_QUEUE_DB}" "$${POSTGRES_CABLE_DB}"; do
          if ! psql -h db -U "$${POSTGRES_USER}" -d postgres -tAc "SELECT 1 FROM pg_database WHERE datname = '$${db}'" | grep -q 1; then
            echo "Creating database: $${db}"
            createdb -h db -U "$${POSTGRES_USER}" "$${db}"
          else
            echo "Database already exists: $${db}"
          fi
        done
    networks:
      - backend-net

  # ── Rails API ────────────────────────────────────────────────────────────────
  backend:
    image: ${BACKEND_IMAGE:-ghcr.io/hashan-athu/multimediary/backend:dev}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
    # No host port — Caddy reaches this via backend-net; nothing is exposed to the host
    expose:
      - "80"
    env_file:
      - .env.production
    environment:
      RAILS_ENV: production
      BACKEND_DATABASE_HOST: db
      BACKEND_DATABASE_PORT: 5432
      BACKEND_PROD_DATABASE_NAME: ${POSTGRES_DB}
      BACKEND_PROD_DATABASE_USERNAME: ${POSTGRES_USER}
      BACKEND_PROD_DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      BACKEND_CACHE_DATABASE_NAME: ${POSTGRES_CACHE_DB}
      BACKEND_QUEUE_DATABASE_NAME: ${POSTGRES_QUEUE_DB}
      BACKEND_CABLE_DATABASE_NAME: ${POSTGRES_CABLE_DB}
      SOLID_QUEUE_IN_PUMA: "true"
      # Single-mode Puma (no worker processes) — saves ~50 MB RSS vs cluster mode with 1 worker
      WEB_CONCURRENCY: "0"
      RAILS_MAX_THREADS: "3"
      # Reduce Ruby's memory allocator arena count to lower RSS
      MALLOC_ARENA_MAX: "2"
    networks:
      - backend-net
    deploy:
      resources:
        limits:
          memory: 400M

  # ── Docs (Nginx serving the static Docusaurus build) ────────────────────────
  # Activate with: docker compose --profile docs up
  docs:
    profiles: ["docs"]
    image: ${DOCS_IMAGE:-ghcr.io/hashan-athu/multimediary/docs:dev}
    restart: unless-stopped
    expose:
      - "80"
    networks:
      - backend-net
    deploy:
      resources:
        limits:
          memory: 32M

  # ── Caddy (reverse proxy + automatic HTTPS) ──────────────────────────────────
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"   # HTTP/3 / QUIC
    environment:
      BACKEND_DOMAIN: ${BACKEND_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data      # Let's Encrypt certificates (persisted across restarts)
      - caddy_config:/config
    networks:
      - backend-net
    deploy:
      resources:
        limits:
          memory: 64M

networks:
  backend-net:
    driver: bridge

volumes:
  pgdata:       # PostgreSQL data — survives container restarts and redeployments
  caddy_data:   # Let's Encrypt certificates — must survive or Caddy re-issues on every restart
  caddy_config:
