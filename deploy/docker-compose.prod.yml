# Production Docker Compose — Oracle VM
# ─────────────────────────────────────────────────────────────────────────────
# This file is deployed to /opt/multimediary/docker-compose.prod.yml on the
# Oracle VM by the GitHub Actions deploy workflow.
#
# The deploy workflow generates .env.production from GitHub Environment secrets.
# To run manually on the VM:
# docker compose --env-file .env.production -f docker-compose.prod.yml up -d
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── PostgreSQL ───────────────────────────────────────────────────────────────
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    volumes:
      - pgdata:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend-net

  # ── PostgreSQL database bootstrap ───────────────────────────────────────────
  db-init:
    image: postgres:17-alpine
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env.production
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
    command:
      - sh
      - -c
      - |
        set -eu
        for db in "$${POSTGRES_DB}" "$${POSTGRES_CACHE_DB}" "$${POSTGRES_QUEUE_DB}" "$${POSTGRES_CABLE_DB}"; do
          if ! psql -h db -U "$${POSTGRES_USER}" -d postgres -tAc "SELECT 1 FROM pg_database WHERE datname = '$${db}'" | grep -q 1; then
            echo "Creating database $${db}"
            createdb -h db -U "$${POSTGRES_USER}" "$${db}"
          fi
        done
    networks:
      - backend-net

  # ── Rails API ────────────────────────────────────────────────────────────────
  backend:
    # BACKEND_IMAGE is exported by the CI deploy step. Default uses :dev tag.
    image: ${BACKEND_IMAGE:-ghcr.io/hashan-athu/multimediary/backend:dev}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
    ports:
      - "${BACKEND_HOST_PORT:-80}:80"       # Thruster HTTP (upgrade to 443 when SSL is configured)
    env_file:
      - .env.production
    environment:
      # Point Rails to the "db" Docker service rather than localhost
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      CACHE_DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_CACHE_DB}
      QUEUE_DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_QUEUE_DB}
      CABLE_DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_CABLE_DB}
      RAILS_ENV: production
      SOLID_QUEUE_IN_PUMA: "true"
    networks:
      - backend-net

networks:
  backend-net:
    driver: bridge

volumes:
  pgdata:   # Persistent PostgreSQL data volume; survives container restarts
