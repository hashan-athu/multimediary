  # ── USERS ─────────────────────────────────────────────────────────────

  /api/v1/admin/users:
    get:
      tags: [Users]
      summary: List admin users
      description: Accessible by super_admin and admin only.
      parameters:
        - in: query
          name: page
          schema: { type: integer, default: 1 }
        - in: query
          name: per_page
          schema: { type: integer, default: 25 }
      responses:
        '200':
          description: Admin users list
          content:
            application/json:
              schema:
                type: object
                properties:
                  users:
                    type: array
                    items: { $ref: '#/components/schemas/User' }
                  meta: { $ref: '#/components/schemas/PaginationMeta' }
        '403': { description: Forbidden }
    post:
      tags: [Users]
      summary: Create an admin user
      description: super_admin only. New users are assigned the editor role by default.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user]
              properties:
                user:
                  type: object
                  required: [email, password, password_confirmation]
                  properties:
                    email:                 { type: string, format: email }
                    password:              { type: string, minLength: 8 }
                    password_confirmation: { type: string }
                    role:
                      type: string
                      enum: [super_admin, admin, editor, analyst]
                      default: editor
      responses:
        '201':
          description: User created
          content:
            application/json:
              schema:
                type: object
                properties:
                  user: { $ref: '#/components/schemas/User' }
        '403': { description: Forbidden — super_admin role required }
        '422':
          description: Validation error
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ValidationError' }

  /api/v1/admin/users/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: integer }
    get:
      tags: [Users]
      summary: Get a user
      description: Accessible by super_admin and admin.
      responses:
        '200':
          description: User detail
          content:
            application/json:
              schema:
                type: object
                properties:
                  user: { $ref: '#/components/schemas/User' }
        '404': { description: Not found }
    patch:
      tags: [Users]
      summary: Update a user's role
      description: super_admin only. A super_admin cannot demote themselves.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user]
              properties:
                user:
                  type: object
                  properties:
                    role:
                      type: string
                      enum: [super_admin, admin, editor, analyst]
      responses:
        '200':
          description: Role updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  user: { $ref: '#/components/schemas/User' }
        '403': { description: Forbidden }
        '422': { description: Cannot demote yourself }
    delete:
      tags: [Users]
      summary: Delete a user
      description: super_admin only.
      responses:
        '200': { description: User deleted }
        '403': { description: Forbidden — super_admin role required }

