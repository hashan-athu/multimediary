              schema:
                type: object
                properties:
                  disk: { $ref: '#/components/schemas/DiskDetail' }
        '404': { description: Not found }
    patch:
      tags: [Disks]
      summary: Update a disk
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                disk:
                  type: object
                  properties:
                    name:           { type: string }
                    storage_type:   { type: string }
                    disk_format_id: { type: integer }
      responses:
        '200':
          description: Disk updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  disk: { $ref: '#/components/schemas/Disk' }
