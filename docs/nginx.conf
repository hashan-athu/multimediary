server {
    listen 80;
    root /usr/share/nginx/html;

    # Redirect bare root to /docs/
    location = / {
        return 301 /docs/;
    }

    # Serve Docusaurus static files under /docs/
    location /docs/ {
        index index.html;
        # Docusaurus generates a file for every route, so no SPA fallback needed.
        # 404.html is generated by Docusaurus for unknown paths.
        try_files $uri $uri/ /docs/404.html;
    }

    # Long-lived cache for content-hashed assets (Docusaurus adds hashes to filenames)
    location ~* \.(?:js|css|woff2?|ttf|eot|ico|png|jpg|jpeg|gif|svg|webp|avif)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Disable access log for favicon/robots
    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }
}
